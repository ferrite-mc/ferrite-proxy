[package]
name = "ferrite-proxy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "High-performance Rust Minecraft Java 26.3 (Protocol 777) Waterfall/Velocity-style proxy"

[dependencies]
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
hmac = "0.12"
md-5 = "0.10"
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v3", "v4"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
